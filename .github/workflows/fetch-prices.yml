name: Fetch Stock Prices

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # When triggered by the bot's own prices.json commit, wait 5 minutes
      # so updates are spaced ~5-6 min apart instead of running continuously.
      - name: Wait (self-triggered runs only)
        if: "contains(github.event.head_commit.message, 'Update prices.json')"
        run: sleep 300

      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yahoo-finance2
        run: npm install yahoo-finance2 --no-save --silent

      - name: Fetch prices
        run: node fetch-prices.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --quiet --cached; then
            echo "No changes"
          else
            git commit -m "Update prices.json"
            git push
          fi
