name: Fetch Stock Prices

on:
  schedule:
    - cron: '0 * * * *'  # Hourly backup - restarts chain if broken
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - 'fetch-prices.mjs'
      - '.github/workflows/fetch-prices.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Only chain-triggered (workflow_dispatch) runs sleep — push and schedule run immediately
      - name: Wait (chain run)
        if: github.event_name == 'workflow_dispatch'
        run: sleep 300

      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yahoo-finance2
        run: npm install yahoo-finance2 --no-save --silent

      - name: Fetch prices
        run: node fetch-prices.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --quiet --cached; then
            echo "No changes"
          else
            git commit -m "Update prices.json [skip ci]"
            git push
          fi

      - name: Trigger next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fetch-prices.yml --ref gh-pages
