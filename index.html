<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watchlist">
<title>Fair Value Watchlist</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #131722;
  --surface: #1e222d;
  --surface2: #2a2e39;
  --border: #363a45;
  --text: #d1d4dc;
  --muted: #787b86;
  --accent: #2962ff;
  --green: #26a69a;
  --red: #ef5350;
  --green-bg: #26a69a18;
  --red-bg: #ef535018;
  --yellow: #f9a825;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: calc(1rem + env(safe-area-inset-bottom));
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.875rem 1rem;
  padding-top: calc(0.875rem + env(safe-area-inset-top));
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky; top: 0; z-index: 20;
}
header h1 { font-size: 1rem; font-weight: 600; color: #fff; letter-spacing: 0.02em; }
.header-right { display: flex; align-items: center; gap: 0.5rem; }
.update-time { font-size: 0.7rem; color: var(--muted); }

.btn {
  border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
  padding: 0.5rem 0.875rem; font-size: 0.8rem; transition: opacity 0.15s;
}
.btn:active { opacity: 0.7; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

main { max-width: 680px; margin: 0 auto; padding: 1rem; }

.summary {
  display: flex; gap: 0.75rem; margin-bottom: 1rem; overflow-x: auto;
  padding-bottom: 0.25rem; scrollbar-width: none;
}
.summary::-webkit-scrollbar { display: none; }
.sum-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.625rem 0.875rem; flex-shrink: 0;
}
.sum-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
.sum-val { font-size: 0.95rem; font-weight: 700; }

.tabs { display: flex; gap: 0.25rem; margin-bottom: 0.5rem; }
.tab {
  padding: 0.375rem 0.75rem; border-radius: 6px; font-size: 0.78rem; font-weight: 500;
  cursor: pointer; border: none; background: transparent; color: var(--muted);
  transition: all 0.15s;
}
.tab.active { background: var(--surface2); color: var(--text); }

.sort-bar {
  display: flex; align-items: center; gap: 0.375rem; margin-bottom: 0.875rem;
  overflow-x: auto; padding-bottom: 0.25rem; scrollbar-width: none;
}
.sort-bar::-webkit-scrollbar { display: none; }
.sort-label { font-size: 0.7rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.sort-btn {
  padding: 0.3rem 0.625rem; border-radius: 6px; font-size: 0.72rem; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted);
  white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
}
.sort-btn.active { background: var(--surface2); color: var(--text); border-color: var(--accent); }
.sort-btn:active { opacity: 0.7; }

.stock-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.875rem 1rem; margin-bottom: 0.5rem;
  cursor: pointer; transition: border-color 0.15s;
  position: relative; overflow: hidden;
}
.stock-card:active { border-color: var(--accent); }
.stock-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}
.stock-card.undervalued::before { background: var(--green); }
.stock-card.overvalued::before { background: var(--red); }
.stock-card.fair::before { background: var(--yellow); }

.card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.625rem; }
.stock-info { flex: 1; display: flex; align-items: center; gap: 0.625rem; min-width: 0; }
.stock-logo {
  width: 36px; height: 36px; border-radius: 50%;
  object-fit: contain; background: #fff;
  border: 1px solid var(--border); flex-shrink: 0; padding: 3px;
}
.logo-fallback {
  width: 36px; height: 36px; border-radius: 50%;
  align-items: center; justify-content: center;
  font-size: 0.85rem; font-weight: 700; color: #fff;
  flex-shrink: 0; display: none;
}
.stock-text { min-width: 0; }
.stock-symbol { font-size: 1rem; font-weight: 700; color: #fff; }
.stock-name { font-size: 0.72rem; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.price-block { text-align: right; flex-shrink: 0; }
.current-price { font-size: 1.1rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.price-change { font-size: 0.75rem; margin-top: 1px; font-variant-numeric: tabular-nums; }

.fv-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
.fv-label { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
.fv-bar-wrap { flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.fv-bar { height: 100%; border-radius: 2px; transition: width 0.4s; }
.fv-bar.under { background: var(--green); }
.fv-bar.over { background: var(--red); }
.fv-bar.fair { background: var(--yellow); }

.signal {
  font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.45rem;
  border-radius: 4px; white-space: nowrap; margin-left: 0.25rem;
}
.signal.buy { background: var(--green-bg); color: var(--green); border: 1px solid #26a69a33; }
.signal.sell { background: var(--red-bg); color: var(--red); border: 1px solid #ef535033; }
.signal.hold { background: #f9a82518; color: var(--yellow); border: 1px solid #f9a82533; }

.upside-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface2); border-radius: 6px;
  padding: 0.375rem 0.625rem; margin-top: 0.25rem;
}
.upside-label { font-size: 0.68rem; color: var(--muted); }
.upside-val { font-size: 0.82rem; font-weight: 700; font-variant-numeric: tabular-nums; }

.card-actions {
  display: flex; gap: 0.5rem; margin-top: 0.75rem;
  padding-top: 0.625rem; border-top: 1px solid var(--border);
}
.card-btn {
  flex: 1; background: var(--surface2); border: none; color: var(--muted);
  border-radius: 6px; padding: 0.4rem; font-size: 0.75rem; cursor: pointer; font-weight: 500;
}
.card-btn:active { opacity: 0.7; }
.move-btn { flex: none !important; width: 38px; font-size: 1.1rem; padding: 0.4rem 0; }
.move-btn:disabled { opacity: 0.25; cursor: default; }

.empty {
  text-align: center; padding: 3.5rem 1rem; color: var(--muted);
  border: 1px dashed var(--border); border-radius: 12px; font-size: 0.875rem; line-height: 1.6;
}
.empty strong { display: block; font-size: 1rem; color: var(--text); margin-bottom: 0.5rem; }

.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); z-index: 100;
  align-items: flex-end; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 16px 16px 0 0;
  padding: 1.5rem 1.25rem;
  padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
  width: 100%; max-width: 680px; border-top: 1px solid var(--border);
}
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: -0.5rem auto 1.25rem; }
.modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1.25rem; color: #fff; }

.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 500; margin-bottom: 0.375rem; text-transform: uppercase; letter-spacing: 0.04em; }
.field input, .field select {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 0.9rem;
  padding: 0.7rem 0.875rem; outline: none; -webkit-appearance: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--muted); }
.field-hint { font-size: 0.7rem; color: var(--muted); margin-top: 0.375rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.modal-btns { display: flex; gap: 0.75rem; margin-top: 1rem; }
.modal-btns .btn { flex: 1; padding: 0.75rem; font-size: 0.875rem; }
.error-msg { color: var(--red); font-size: 0.78rem; margin-bottom: 0.75rem; }

.ac-wrap { position: relative; }
.ac-list {
  display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 30;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; margin-top: 3px; overflow: hidden;
}
.ac-list.open { display: block; }
.ac-item {
  padding: 0.625rem 0.875rem; cursor: pointer; font-size: 0.85rem;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
}
.ac-item:last-child { border-bottom: none; }
.ac-item:active { background: var(--border); }
.ac-sym { font-weight: 700; color: #fff; }

.spin { display: inline-block; animation: rotate 0.8s linear infinite; }
@keyframes rotate { to { transform: rotate(360deg); } }

/* ── VIX card ── */
.vix-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.75rem;
  display: flex; justify-content: space-between; align-items: center;
  position: relative; overflow: hidden;
}
.vix-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #ab47bc; }
.vix-left { display: flex; flex-direction: column; gap: 2px; }
.vix-title { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.vix-value { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.vix-change { font-size: 0.72rem; font-variant-numeric: tabular-nums; }
.vix-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.375rem; }
.vix-badge {
  font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.55rem;
  border-radius: 6px; white-space: nowrap;
}
.vix-desc { font-size: 0.65rem; color: var(--muted); text-align: right; max-width: 110px; line-height: 1.4; }

/* ── Page navigation ── */
.page-nav {
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; gap: 0; position: sticky; top: 53px; z-index: 19;
}
.page-tab {
  flex: 1; padding: 0.625rem 0.5rem; font-size: 0.82rem; font-weight: 600;
  border: none; background: transparent; color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 0.15s;
}
.page-tab.active { color: #fff; border-bottom-color: var(--accent); }

/* ── BUY/SELL Plan ── */
.plan-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.875rem 1rem; margin-bottom: 0.5rem;
  position: relative; overflow: hidden;
}
.plan-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent);
}
.plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
.plan-price { font-size: 1rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.plan-price-sub { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }

.plan-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.5rem;
}
.plan-cell {
  background: var(--surface2); border-radius: 8px; padding: 0.5rem 0.625rem;
}
.plan-cell-label {
  font-size: 0.65rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 3px;
}
.plan-cell-val { font-size: 0.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.plan-cell-hint { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
.plan-badge {
  display: inline-block; font-size: 0.65rem; font-weight: 700;
  padding: 0.1rem 0.4rem; border-radius: 4px; margin-top: 3px;
}
.plan-badge.go  { background: var(--green-bg); color: var(--green); border: 1px solid #26a69a33; }
.plan-badge.wait{ background: #f9a82518; color: var(--yellow); border: 1px solid #f9a82533; }

.plan-actions { display: flex; gap: 0.5rem; margin-top: 0.625rem; padding-top: 0.625rem; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">Fair Value Watchlist</h1>
  <div class="header-right">
    <span class="update-time" id="updateTime">—</span>
    <button class="btn btn-ghost" id="refreshBtn" onclick="doRefresh()">↻</button>
    <button class="btn btn-accent" id="addBtn" onclick="handleAdd()">+ Přidat</button>
  </div>
</header>

<nav class="page-nav">
  <button class="page-tab active" onclick="setPage('watchlist', this)">📊 Watchlist</button>
  <button class="page-tab" onclick="setPage('plan', this)">🎯 BUY / SELL</button>
</nav>

<main>
  <!-- PAGE: Watchlist -->
  <div id="page-watchlist">
    <div class="vix-card" id="vixCard"><div style="color:var(--muted);font-size:.85rem">Načítám VIX…</div></div>
    <div class="summary" id="summary"></div>
    <div class="tabs">
      <button class="tab active" onclick="setFilter('all', this)">Vše</button>
      <button class="tab" onclick="setFilter('undervalued', this)">Podhodnocené</button>
      <button class="tab" onclick="setFilter('overvalued', this)">Nadhodnocené</button>
    </div>
    <div class="sort-bar">
      <span class="sort-label">Řadit:</span>
      <button class="sort-btn active" onclick="setSort('custom', this)">↕ Vlastní</button>
      <button class="sort-btn" onclick="setSort('most-under', this)">▼ Nejpodhodnocenější</button>
      <button class="sort-btn" onclick="setSort('most-over', this)">▲ Nejnadhodnocenější</button>
      <button class="sort-btn" onclick="setSort('az', this)">A–Z</button>
    </div>
    <div id="list"></div>
  </div>

  <!-- PAGE: BUY/SELL Plan -->
  <div id="page-plan" style="display:none">
    <div class="sort-bar">
      <span class="sort-label">Řadit:</span>
      <button class="sort-btn active" id="ps-custom"  onclick="setPlanSort('custom', this)">↕ Vlastní</button>
      <button class="sort-btn"        id="ps-buy"     onclick="setPlanSort('buy', this)">▼ Nejblíže k nákupu</button>
      <button class="sort-btn"        id="ps-sell"    onclick="setPlanSort('sell', this)">▲ Nejblíže k prodeji</button>
    </div>
    <div id="planList"></div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modalTitle">Přidat akcii</h2>

    <div class="field" id="symbolField">
      <label>Symbol / Ticker</label>
      <div class="ac-wrap">
        <input id="fSymbol" placeholder="AAPL, MSFT, TSLA, SPY..." autocomplete="off" autocapitalize="characters" oninput="onSymbolInput()" onblur="setTimeout(closeAc,150)">
        <div class="ac-list" id="acList"></div>
      </div>
      <div class="field-hint">Zadej US ticker symbol (např. AAPL pro Apple)</div>
    </div>

    <div class="field" id="nameField">
      <label>Název (volitelně)</label>
      <input id="fName" placeholder="Apple Inc.">
    </div>

    <div class="row2">
      <div class="field">
        <label>Férná hodnota (USD)</label>
        <input id="fFair" type="number" min="0" step="any" placeholder="180.00" inputmode="decimal">
        <div class="field-hint">Tvoje odhadovaná spravedlivá cena</div>
      </div>
      <div class="field">
        <label>Tolerance (%)</label>
        <input id="fTol" type="number" min="0" max="50" step="1" placeholder="5" inputmode="decimal" value="5">
        <div class="field-hint">Pásmo „fair" okolo FV</div>
      </div>
    </div>

    <div class="field">
      <label>Poznámka</label>
      <input id="fNote" placeholder="Proč je tato cena správná?">
    </div>

    <div class="error-msg" id="modalError"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Zrušit</button>
      <button class="btn btn-accent" id="modalSubmit" onclick="submitModal()">Přidat</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayPlan" onclick="overlayPlanClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="planModalTitle">Přidat plán</h2>

    <div class="field" id="planSymbolField">
      <label>Symbol / Ticker</label>
      <div class="ac-wrap">
        <input id="pSymbol" placeholder="AAPL, MSFT, TSLA..." autocomplete="off" autocapitalize="characters" oninput="onPlanSymbolInput()" onblur="setTimeout(closePlanAc,150)">
        <div class="ac-list" id="planAcList"></div>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Cíl nákupu (USD)</label>
        <input id="pBuy" type="number" min="0" step="any" placeholder="150.00" inputmode="decimal">
        <div class="field-hint">Cena, při které chceš nakoupit</div>
      </div>
      <div class="field">
        <label>Cíl prodeje (USD)</label>
        <input id="pSell" type="number" min="0" step="any" placeholder="220.00" inputmode="decimal">
        <div class="field-hint">Cena, při které chceš prodat</div>
      </div>
    </div>

    <div class="field">
      <label>% pozice k prodeji</label>
      <input id="pSellPct" type="number" min="1" max="100" step="1" placeholder="25" inputmode="decimal">
      <div class="field-hint">Kolik procent pozice chceš prodat</div>
    </div>

    <div class="field">
      <label>Poznámka</label>
      <input id="pNote" placeholder="Volitelná poznámka...">
    </div>

    <div class="error-msg" id="planModalError"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closePlanModal()">Zrušit</button>
      <button class="btn btn-accent" id="planModalSubmit" onclick="submitPlanModal()">Přidat</button>
    </div>
  </div>
</div>

<script>
function load() {
  try { return JSON.parse(localStorage.getItem('fv_watchlist') || '[]'); } catch { return []; }
}
function save(d) { localStorage.setItem('fv_watchlist', JSON.stringify(d)); }

let prices = {};
let vixData = null;
let filter = 'all';
let sortBy = 'custom';
let page = 'watchlist';

// ── Plan data ──
function loadPlan() {
  try { return JSON.parse(localStorage.getItem('fv_plan') || '[]'); } catch { return []; }
}
function savePlan(d) { localStorage.setItem('fv_plan', JSON.stringify(d)); }

// ── Page switching ──
function setPage(p, el) {
  page = p;
  document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-watchlist').style.display = p === 'watchlist' ? '' : 'none';
  document.getElementById('page-plan').style.display = p === 'plan' ? '' : 'none';
  document.getElementById('pageTitle').textContent = p === 'watchlist' ? 'Fair Value Watchlist' : 'BUY / SELL Plán';
  if (p === 'plan') renderPlan();
}

function handleAdd() {
  if (page === 'plan') openPlanModal(-1);
  else openAddModal();
}

let planSortBy = 'custom';

function setPlanSort(s, el) {
  planSortBy = s;
  document.querySelectorAll('#page-plan .sort-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderPlan();
}

function moveUpPlan(i) {
  if (i <= 0) return;
  const d = loadPlan();
  [d[i - 1], d[i]] = [d[i], d[i - 1]];
  savePlan(d); renderPlan();
}

function moveDownPlan(i) {
  const d = loadPlan();
  if (i >= d.length - 1) return;
  [d[i], d[i + 1]] = [d[i + 1], d[i]];
  savePlan(d); renderPlan();
}

// Consistent color per ticker for fallback avatar
function symbolColor(sym) {
  const palette = ['#2962ff','#26a69a','#ef5350','#f9a825','#ab47bc','#42a5f5','#66bb6a','#ff7043','#26c6da','#ec407a'];
  let h = 0;
  for (let i = 0; i < sym.length; i++) h = (h * 31 + sym.charCodeAt(i)) & 0xffff;
  return palette[h % palette.length];
}

function logoHtml(symbol) {
  const url = `https://assets.parqet.com/logos/symbol/${encodeURIComponent(symbol)}`;
  const color = symbolColor(symbol);
  const letter = symbol.replace(/[^A-Z]/gi, '').charAt(0).toUpperCase() || symbol.charAt(0).toUpperCase();
  return `<img class="stock-logo" src="${url}" alt=""
    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="logo-fallback" style="background:${color}">${letter}</div>`;
}

const PROXIES = [
  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  url => `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(url)}`,
];

// AbortSignal.timeout() needs iOS Safari 16.4+; this works on older versions too.
function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

function dbg(msg) {
  console.log('[WL]', msg);
  const el = document.getElementById('dbgLog');
  if (el) { el.textContent += msg + '\n'; el.scrollTop = el.scrollHeight; }
}

async function tryProxy(proxyFn, sourceUrl, parse) {
  const pUrl = proxyFn(sourceUrl);
  const label = pUrl.replace(/https?:\/\//, '').slice(0, 40);
  try {
    const r = await fetchWithTimeout(pUrl, 5000);
    if (!r.ok) { dbg(`FAIL ${r.status} ${label}`); return null; }
    const data = await r.json();
    const raw = pUrl.includes('allorigins') ? JSON.parse(data.contents) : data;
    const result = parse(raw);
    dbg(result ? `OK   ${label}` : `NULL ${label}`);
    return result;
  } catch(e) { dbg(`ERR  ${e.message?.slice(0,30)} | ${label}`); return null; }
}

const parseStooq = raw => {
  const item = raw?.symbols?.[0];
  const close = parseFloat(item?.Close ?? item?.close ?? item?.c ?? 0);
  const open  = parseFloat(item?.Open  ?? item?.open  ?? item?.o ?? 0);
  return close > 0 ? { price: close, change1d: open > 0 ? ((close - open) / open) * 100 : null } : null;
};

const parseYhV7 = raw => {
  const q = raw?.quoteResponse?.result?.[0];
  return q?.regularMarketPrice > 0
    ? { price: q.regularMarketPrice, change1d: q.regularMarketChangePercent ?? null }
    : null;
};

const parseYhV8 = raw => {
  const meta  = raw?.chart?.result?.[0]?.meta;
  const price = meta?.regularMarketPrice;
  const prev  = meta?.previousClose ?? meta?.chartPreviousClose;
  return price > 0 ? { price, change1d: prev ? ((price - prev) / prev * 100) : null } : null;
};

async function tryDirect(url, parse) {
  try {
    const r = await fetchWithTimeout(url, 3000);
    if (!r.ok) return null;
    return parse(await r.json());
  } catch { return null; }
}

// Try direct first, then each proxy sequentially (all sources per proxy in parallel).
// Sequential proxy strategy prevents rate-limiting from too many concurrent requests.
async function trySources(sources) {
  const directResults = await Promise.all(sources.map(s => tryDirect(s.url, s.parse)));
  const directHit = directResults.find(r => r != null) ?? null;
  if (directHit) return directHit;
  for (const proxy of PROXIES) {
    const results = await Promise.all(sources.map(s => tryProxy(proxy, s.url, s.parse)));
    const hit = results.find(r => r != null) ?? null;
    if (hit) return hit;
  }
  return null;
}

async function fetchVix() {
  const sources = [
    { url: `https://query2.finance.yahoo.com/v7/finance/quote?symbols=%5EVIX`,              parse: parseYhV7 },
    { url: `https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?interval=1d&range=2d`, parse: parseYhV8 },
    { url: `https://stooq.com/q/l/?s=vix&f=sd2t2ohlcv&h&e=json`,                            parse: parseStooq },
    { url: `https://stooq.com/q/l/?s=^vix&f=sd2t2ohlcv&h&e=json`,                           parse: parseStooq },
  ];
  return trySources(sources);
}

async function fetchPrice(symbol) {
  const sym = symbol.toUpperCase();
  const enc = encodeURIComponent(sym);
  const stooqSym = sym.includes('.') ? sym.toLowerCase() : sym.toLowerCase() + '.us';
  const sources = [
    { url: `https://query2.finance.yahoo.com/v7/finance/quote?symbols=${enc}`,              parse: parseYhV7 },
    { url: `https://query1.finance.yahoo.com/v8/finance/chart/${enc}?interval=1d&range=2d`, parse: parseYhV8 },
    { url: `https://stooq.com/q/l/?s=${stooqSym}&f=sd2t2ohlcv&h&e=json`,                    parse: parseStooq },
  ];
  return trySources(sources);
}

async function doRefresh() {
  const list = load();
  const btn = document.getElementById('refreshBtn');
  btn.innerHTML = '<span class="spin">↻</span>';
  btn.disabled = true;
  document.getElementById('updateTime').textContent = 'Obnovuji...';

  // VIX + first 3 stocks simultaneously, then remaining stocks in chunks of 3.
  // Chunks avoid hammering CORS proxies with too many concurrent requests.
  const CHUNK = 3;
  const chunks = [];
  for (let i = 0; i < list.length; i += CHUNK) chunks.push(list.slice(i, i + CHUNK));

  const [vixResult, ...firstResults] = await Promise.all([
    fetchVix(),
    ...(chunks[0] ?? []).map(s => fetchPrice(s.symbol)),
  ]);
  if (vixResult) vixData = vixResult;
  (chunks[0] ?? []).forEach((s, i) => { if (firstResults[i]) prices[s.symbol] = firstResults[i]; });
  render();

  for (const chunk of chunks.slice(1)) {
    const results = await Promise.all(chunk.map(s => fetchPrice(s.symbol)));
    chunk.forEach((s, i) => { if (results[i]) prices[s.symbol] = results[i]; });
    render();
  }

  const now = new Date();
  document.getElementById('updateTime').textContent =
    `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  btn.innerHTML = '↻';
  btn.disabled = false;
  render();
}

function renderVix() {

    } else if (v < 30) {

      badgeStyle = 'background:#f9a82518;color:var(--yellow);border:1px solid #f9a82533';
    } else {

    }

    <div class="vix-left">
      <div class="vix-title">VIX · Volatility Index</div>
      <div class="vix-value" style="color:${color}">${v !== null ? v.toFixed(2) : '—'}</div>
      ${chg !== null ? `<div class="vix-change" style="color:${chg >= 0 ? 'var(--red)' : 'var(--green)'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}% dnes</div>` : ''}
    </div>
    <div class="vix-right">
      <span class="vix-badge" style="${badgeStyle}">${label}</span>
      <div class="vix-desc">${desc}</div>
    </div>`;
}

function getSignal(current, fair, tol) {
  if (!current || !fair) return { type: 'unknown', pct: null, diff: null, upside: null };
  const pct    = ((current - fair) / fair) * 100;
  const diff   = current - fair;
  const upside = (fair / current - 1) * 100;
  let type;
  if (pct < -tol) type = 'undervalued';
  else if (pct > tol) type = 'overvalued';
  else type = 'fair';
  return { type, pct, diff, upside };
}

function fmt(n, d = 2) {
  if (n == null) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtPct(n) {
  if (n == null) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function setSort(s, el) {
  sortBy = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function moveUp(i) {
  if (i <= 0) return;
  const d = load();
  [d[i - 1], d[i]] = [d[i], d[i - 1]];
  save(d); render();
}

function moveDown(i) {
  const d = load();
  if (i >= d.length - 1) return;
  [d[i], d[i + 1]] = [d[i + 1], d[i]];
  save(d); render();
}

function render() {
  renderVix();
  const list = load();
  const total = list.length;
  const under = list.filter(s => { const p = prices[s.symbol]; return p && getSignal(p.price, s.fair, s.tol || 5).type === 'undervalued'; }).length;
  const over  = list.filter(s => { const p = prices[s.symbol]; return p && getSignal(p.price, s.fair, s.tol || 5).type === 'overvalued'; }).length;
  const fair  = list.filter(s => { const p = prices[s.symbol]; return p && getSignal(p.price, s.fair, s.tol || 5).type === 'fair'; }).length;

  document.getElementById('summary').innerHTML = [
    ['Sledováno', total],
    [`<span style="color:var(--green)">▼ Podh.</span>`, under],
    [`<span style="color:var(--yellow)">≈ Fair</span>`, fair],
    [`<span style="color:var(--red)">▲ Nadh.</span>`, over],
  ].map(([l, v]) => `<div class="sum-card"><div class="sum-label">${l}</div><div class="sum-val">${v}</div></div>`).join('');

  let visible = filter === 'all' ? [...list] : list.filter(s => {
    const p = prices[s.symbol];
    if (!p) return false;
    return getSignal(p.price, s.fair, s.tol || 5).type === filter;
  });

  // Apply sort
  if (sortBy === 'most-under') {
    visible.sort((a, b) => {
      const pa = prices[a.symbol]?.price, pb = prices[b.symbol]?.price;
      const sa = pa != null ? getSignal(pa, a.fair, a.tol || 5).pct : Infinity;
      const sb = pb != null ? getSignal(pb, b.fair, b.tol || 5).pct : Infinity;
      return (sa ?? Infinity) - (sb ?? Infinity);
    });
  } else if (sortBy === 'most-over') {
    visible.sort((a, b) => {
      const pa = prices[a.symbol]?.price, pb = prices[b.symbol]?.price;
      const sa = pa != null ? getSignal(pa, a.fair, a.tol || 5).pct : -Infinity;
      const sb = pb != null ? getSignal(pb, b.fair, b.tol || 5).pct : -Infinity;
      return (sb ?? -Infinity) - (sa ?? -Infinity);
    });
  } else if (sortBy === 'az') {
    visible.sort((a, b) => a.symbol.localeCompare(b.symbol));
  }

  if (!list.length) {
    document.getElementById('list').innerHTML = `
      <div class="empty">
        <strong>Watchlist je prázdný</strong>
        Přidej první akcii tlačítkem „+ Přidat".<br>
        Nastav si férnou hodnotu a sleduj,<br>kdy je čas nakoupit nebo prodat.
      </div>`;
    return;
  }

  if (!visible.length) {
    document.getElementById('list').innerHTML = `<div class="empty">Žádné akcie v této kategorii.</div>`;
    return;
  }

  document.getElementById('list').innerHTML = visible.map((s) => {
    const realIndex = list.findIndex(x => x.id === s.id);
    const p = prices[s.symbol];
    const curr = p?.price ?? null;
    const chg  = p?.change1d ?? null;
    const sig  = getSignal(curr, s.fair, s.tol || 5);

    let barPct = 50, barClass = 'fair';
    if (sig.pct !== null) {
      const cap = Math.max((s.tol || 5) * 4, 20);
      barPct = Math.min(100, Math.max(0, 50 + (sig.pct / cap) * 50));
      barClass = sig.type === 'undervalued' ? 'under' : sig.type === 'overvalued' ? 'over' : 'fair';
    }

    const signalLabel = { undervalued: 'NAKUP', overvalued: 'PRODEJ', fair: 'FAIR', unknown: '—' }[sig.type];
    const signalCls   = { undervalued: 'buy', overvalued: 'sell', fair: 'hold', unknown: 'hold' }[sig.type];
    const cardCls     = { undervalued: 'undervalued', overvalued: 'overvalued', fair: 'fair', unknown: '' }[sig.type];

    let upsideHtml = '';
    if (sig.upside !== null && sig.type !== 'fair') {
      const color = sig.type === 'undervalued' ? 'var(--green)' : 'var(--red)';
      upsideHtml = `
        <div class="upside-row">
          <span class="upside-label">Potenciální růst</span>
          <span class="upside-val" style="color:${color}">${fmtPct(sig.upside)} ($${fmt(Math.abs(s.fair - curr))})</span>
        </div>`;
    }

    const moveHtml = sortBy === 'custom' ? `
      <button class="card-btn move-btn" onclick="event.stopPropagation();moveUp(${realIndex})" ${realIndex === 0 ? 'disabled' : ''} title="Posunout nahoru">↑</button>
      <button class="card-btn move-btn" onclick="event.stopPropagation();moveDown(${realIndex})" ${realIndex === list.length - 1 ? 'disabled' : ''} title="Posunout dolů">↓</button>
    ` : '';

    return `
    <div class="stock-card ${cardCls}" onclick="toggleExpand('card-${s.id}')">
      <div class="card-top">
        <div class="stock-info">
          ${logoHtml(s.symbol)}
          <div class="stock-text">
            <div class="stock-symbol">${s.symbol}</div>
            <div class="stock-name">${s.name || s.symbol}</div>
          </div>
        </div>
        <div class="price-block">
          <div class="current-price">${curr !== null ? '$' + fmt(curr) : '<span style="color:var(--muted);font-size:.85rem">Načítám…</span>'}</div>
          ${chg !== null ? `<div class="price-change" style="color:${chg >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtPct(chg)} dnes</div>` : ''}
        </div>
      </div>
      <div class="fv-row">
        <div class="fv-label">FV $${fmt(s.fair)}</div>
        <div class="fv-bar-wrap"><div class="fv-bar ${barClass}" style="width:${barPct}%"></div></div>
        <div style="font-size:0.78rem;color:${sig.type==='undervalued'?'var(--green)':sig.type==='overvalued'?'var(--red)':'var(--yellow)'}">
          ${sig.pct !== null ? fmtPct(sig.pct) : '—'}
        </div>
        <span class="signal ${signalCls}">${signalLabel}</span>
      </div>
      ${upsideHtml}
      ${s.note ? `<div style="font-size:0.72rem;color:var(--muted);margin-top:0.375rem"><em>${s.note}</em></div>` : ''}
      <div class="card-actions" id="card-${s.id}" style="display:none">
        ${moveHtml}
        <button class="card-btn" onclick="event.stopPropagation();openEditModal(${realIndex})">Upravit FV</button>
        <button class="card-btn" onclick="event.stopPropagation();deleteItem(${realIndex})" style="color:var(--red)">Odebrat</button>
      </div>
    </div>`;
  }).join('');
}

function toggleExpand(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'flex' : 'none';
}

function deleteItem(i) {
  if (!confirm('Odebrat tuto akcii?')) return;
  const d = load(); d.splice(i, 1); save(d); render();
}

let editIndex = -1;

function openAddModal() {
  editIndex = -1;
  document.getElementById('modalTitle').textContent = 'Přidat akcii';
  document.getElementById('modalSubmit').textContent = 'Přidat';
  document.getElementById('symbolField').style.display = '';
  document.getElementById('nameField').style.display = '';
  ['fSymbol','fName','fNote'].forEach(id => document.getElementById(id).value = '');

  document.getElementById('fTol').value = '5';
  document.getElementById('modalError').textContent = '';
  document.getElementById('overlay').classList.add('open');
}

function openEditModal(i) {
  const d = load()[i];
  editIndex = i;
  document.getElementById('modalTitle').textContent = `Upravit: ${d.symbol}`;
  document.getElementById('modalSubmit').textContent = 'Uložit';
  document.getElementById('symbolField').style.display = 'none';
  document.getElementById('nameField').style.display = 'none';
  document.getElementById('fFair').value = d.fair;
  document.getElementById('fTol').value = d.tol || 5;
  document.getElementById('fNote').value = d.note || '';

}

function closeModal() { document.getElementById('overlay').classList.remove('open'); closeAc(); }
function overlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

function submitModal() {
  const fair = parseFloat(document.getElementById('fFair').value);
  const tol  = parseFloat(document.getElementById('fTol').value);
  const note = document.getElementById('fNote').value.trim();
  if (isNaN(fair) || fair <= 0) { document.getElementById('modalError').textContent = 'Zadej platnou férnou hodnotu.'; return; }
  const d = load();
  if (editIndex >= 0) {
    d[editIndex] = { ...d[editIndex], fair, tol: isNaN(tol) ? 5 : tol, note };
    save(d); closeModal(); render(); return;
  }
  const symbol = document.getElementById('fSymbol').value.trim().toUpperCase();
  const name   = document.getElementById('fName').value.trim();
  if (!symbol) { document.getElementById('modalError').textContent = 'Zadej ticker symbol.'; return; }
  if (d.find(x => x.symbol === symbol)) { document.getElementById('modalError').textContent = 'Tato akcie už je na watchlistu.'; return; }
  d.push({ id: Date.now().toString(), symbol, name: name || symbol, fair, tol: isNaN(tol) ? 5 : tol, note });
  save(d); closeModal();
  fetchPrice(symbol).then(p => {
    if (p) prices[symbol] = p;
    render();
    const now = new Date();
    document.getElementById('updateTime').textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  });
  render();
}

let acTimer;
function onSymbolInput() {
  const q = document.getElementById('fSymbol').value.trim();
  clearTimeout(acTimer);
  if (!q) { closeAc(); return; }
  acTimer = setTimeout(() => searchAc(q), 300);
}

function searchAc(q) {
  const common = ['AAPL','MSFT','GOOGL','AMZN','NVDA','TSLA','META','BRK.B','JPM','V','WMT','XOM',
    'SPY','QQQ','VTI','VOO','IWM','GLD','TLT','XLF','XLK','ARKK','DIA','IEFA'];
  const matches = common.filter(s => s.startsWith(q.toUpperCase())).slice(0, 5);
  if (!matches.length) { closeAc(); return; }
  const list = document.getElementById('acList');
  list.innerHTML = matches.map(s => `<div class="ac-item" onclick="pickAc('${s}')"><span class="ac-sym">${s}</span></div>`).join('');
  list.classList.add('open');
}

function pickAc(sym) {
  document.getElementById('fSymbol').value = sym;
  closeAc();
}
function closeAc() {
  document.getElementById('acList').classList.remove('open');
  document.getElementById('acList').innerHTML = '';
}

// ── BUY/SELL Plan rendering ──
function renderPlan() {
  const plan = loadPlan();
  const el = document.getElementById('planList');

  if (!plan.length) {
    el.innerHTML = `<div class="empty"><strong>Plán je prázdný</strong>Přidej akcii tlačítkem „+ Přidat".<br>Nastav cílovou cenu nákupu a prodeje.</div>`;
    return;
  }

  // Build sorted view (keep realIndex for move buttons)
  let sorted = plan.map((entry, realIndex) => ({ entry, realIndex }));

  if (planSortBy === 'buy') {
    sorted.sort((a, b) => {
      const ca = prices[a.entry.symbol]?.price;
      const cb = prices[b.entry.symbol]?.price;
      const da = (ca != null && a.entry.buyTarget != null) ? Math.abs((a.entry.buyTarget - ca) / ca) : Infinity;
      const db = (cb != null && b.entry.buyTarget != null) ? Math.abs((b.entry.buyTarget - cb) / cb) : Infinity;
      return da - db;
    });
  } else if (planSortBy === 'sell') {
    sorted.sort((a, b) => {
      const ca = prices[a.entry.symbol]?.price;
      const cb = prices[b.entry.symbol]?.price;
      const da = (ca != null && a.entry.sellTarget != null) ? Math.abs((a.entry.sellTarget - ca) / ca) : Infinity;
      const db = (cb != null && b.entry.sellTarget != null) ? Math.abs((b.entry.sellTarget - cb) / cb) : Infinity;
      return da - db;
    });
  }

  el.innerHTML = sorted.map(({ entry, realIndex }) => {
    const i = realIndex;
    const curr = prices[entry.symbol]?.price ?? null;

    const buyVal   = entry.buyTarget  != null ? entry.buyTarget  : null;
    const sellVal  = entry.sellTarget != null ? entry.sellTarget : null;
    const sellPct  = entry.sellPct    != null ? entry.sellPct    : null;

    // BUY status
    let buyHtml = '<span style="color:var(--muted)">—</span>';
    if (buyVal != null) {
      const canBuy = curr != null && curr <= buyVal;
      const pctToBuy = curr != null ? ((buyVal - curr) / curr * 100) : null;
      buyHtml = `
        <div class="plan-cell-val" style="color:${canBuy ? 'var(--green)' : '#fff'}">$${fmt(buyVal)}</div>
        ${pctToBuy != null ? `<div class="plan-cell-hint" style="color:${canBuy ? 'var(--green)' : 'var(--muted)'}">
          ${canBuy ? `▲ ${Math.abs(pctToBuy).toFixed(1)}% nad cílem` : `▼ ${Math.abs(pctToBuy).toFixed(1)}% k nákupu`}
        </div>` : ''}
        <span class="plan-badge ${canBuy ? 'go' : 'wait'}">${canBuy ? '✓ NAKUP' : 'ČEKEJ'}</span>`;
    }

    // SELL status
    let sellHtml = '<span style="color:var(--muted)">—</span>';
    if (sellVal != null) {
      const canSell = curr != null && curr >= sellVal;
      const pctToSell = curr != null ? ((sellVal - curr) / curr * 100) : null;
      sellHtml = `
        <div class="plan-cell-val" style="color:${canSell ? 'var(--red)' : '#fff'}">$${fmt(sellVal)}${sellPct != null ? ` · ${sellPct}%` : ''}</div>
        ${pctToSell != null ? `<div class="plan-cell-hint" style="color:${canSell ? 'var(--red)' : 'var(--muted)'}">
          ${canSell ? `▼ ${Math.abs(pctToSell).toFixed(1)}% pod cílem` : `▲ ${Math.abs(pctToSell).toFixed(1)}% k prodeji`}
        </div>` : ''}
        <span class="plan-badge ${canSell ? 'go' : 'wait'}" style="${canSell ? 'background:var(--red-bg);color:var(--red);border-color:#ef535033' : ''}">${canSell ? '✓ PRODEJ' : 'ČEKEJ'}</span>`;
    }

    return `
    <div class="plan-card">
      <div class="plan-header">
        <div class="stock-info">
          ${logoHtml(entry.symbol)}
          <div class="stock-text">
            <div class="stock-symbol">${entry.symbol}</div>
            <div class="stock-name">${entry.name || entry.symbol}</div>
          </div>
        </div>
        <div class="price-block">
          <div class="plan-price">${curr != null ? '$' + fmt(curr) : '<span style="color:var(--muted);font-size:.85rem">—</span>'}</div>
          <div class="plan-price-sub">Aktuální cena</div>
        </div>
      </div>
      <div class="plan-row">
        <div class="plan-cell">
          <div class="plan-cell-label">Cíl nákupu</div>
          ${buyHtml}
        </div>
        <div class="plan-cell">
          <div class="plan-cell-label">Cíl prodeje</div>
          ${sellHtml}
        </div>
      </div>
      ${entry.note ? `<div style="font-size:0.72rem;color:var(--muted);margin-bottom:0.5rem"><em>${entry.note}</em></div>` : ''}
      <div class="plan-actions">
        ${planSortBy === 'custom' ? `
          <button class="card-btn move-btn" onclick="moveUpPlan(${i})" ${i === 0 ? 'disabled' : ''} title="Posunout nahoru">↑</button>
          <button class="card-btn move-btn" onclick="moveDownPlan(${i})" ${i === plan.length - 1 ? 'disabled' : ''} title="Posunout dolů">↓</button>
        ` : ''}
        <button class="card-btn" onclick="openPlanModal(${i})">Upravit</button>
        <button class="card-btn" onclick="deletePlan(${i})" style="color:var(--red)">Odebrat</button>
      </div>
    </div>`;
  }).join('');
}

function deletePlan(i) {
  if (!confirm('Odebrat tento záznam?')) return;
  const d = loadPlan(); d.splice(i, 1); savePlan(d); renderPlan();
}

let planEditIndex = -1;

function openPlanModal(i) {
  planEditIndex = i;
  const isEdit = i >= 0;
  document.getElementById('planModalTitle').textContent = isEdit ? `Upravit plán` : 'Přidat plán';
  document.getElementById('planModalSubmit').textContent = isEdit ? 'Uložit' : 'Přidat';
  document.getElementById('planSymbolField').style.display = isEdit ? 'none' : '';
  document.getElementById('planModalError').textContent = '';

  if (isEdit) {
    const entry = loadPlan()[i];
    document.getElementById('pSymbol').value = entry.symbol;
    document.getElementById('pBuy').value    = entry.buyTarget  ?? '';
    document.getElementById('pSell').value   = entry.sellTarget ?? '';
    document.getElementById('pSellPct').value = entry.sellPct   ?? '';
    document.getElementById('pNote').value   = entry.note       ?? '';
  } else {
    ['pSymbol','pBuy','pSell','pSellPct','pNote'].forEach(id => document.getElementById(id).value = '');
  }
  document.getElementById('overlayPlan').classList.add('open');
}

function closePlanModal() {
  document.getElementById('overlayPlan').classList.remove('open');
  closePlanAc();
}
function overlayPlanClick(e) { if (e.target === document.getElementById('overlayPlan')) closePlanModal(); }

function submitPlanModal() {
  const buyTarget  = document.getElementById('pBuy').value.trim();
  const sellTarget = document.getElementById('pSell').value.trim();
  const sellPct    = document.getElementById('pSellPct').value.trim();
  const note       = document.getElementById('pNote').value.trim();

  const buyNum  = buyTarget  ? parseFloat(buyTarget)  : null;
  const sellNum = sellTarget ? parseFloat(sellTarget) : null;
  const pctNum  = sellPct    ? parseFloat(sellPct)    : null;

  if (buyNum  !== null && (isNaN(buyNum)  || buyNum  <= 0)) { document.getElementById('planModalError').textContent = 'Neplatná cena nákupu.'; return; }
  if (sellNum !== null && (isNaN(sellNum) || sellNum <= 0)) { document.getElementById('planModalError').textContent = 'Neplatná cena prodeje.'; return; }
  if (pctNum  !== null && (isNaN(pctNum)  || pctNum  <= 0 || pctNum > 100)) { document.getElementById('planModalError').textContent = '% musí být 1–100.'; return; }

  const d = loadPlan();
  if (planEditIndex >= 0) {
    d[planEditIndex] = { ...d[planEditIndex], buyTarget: buyNum, sellTarget: sellNum, sellPct: pctNum, note };
    savePlan(d); closePlanModal(); renderPlan(); return;
  }

  const symbol = document.getElementById('pSymbol').value.trim().toUpperCase();
  if (!symbol) { document.getElementById('planModalError').textContent = 'Zadej ticker symbol.'; return; }

  // Get name from watchlist if available
  const wl = load();
  const wlEntry = wl.find(x => x.symbol === symbol);
  const name = wlEntry?.name || symbol;

  d.push({ id: Date.now().toString(), symbol, name, buyTarget: buyNum, sellTarget: sellNum, sellPct: pctNum, note });
  savePlan(d); closePlanModal();

  // Fetch price if not cached
  if (!prices[symbol]) {
    fetchPrice(symbol).then(p => { if (p) { prices[symbol] = p; } renderPlan(); });
  }
  renderPlan();
}

let planAcTimer;
function onPlanSymbolInput() {
  const q = document.getElementById('pSymbol').value.trim();
  clearTimeout(planAcTimer);
  if (!q) { closePlanAc(); return; }
  planAcTimer = setTimeout(() => searchPlanAc(q), 300);
}
function searchPlanAc(q) {
  const common = ['AAPL','MSFT','GOOGL','AMZN','NVDA','TSLA','META','BRK.B','JPM','V','WMT','XOM',
    'SPY','QQQ','VTI','VOO','IWM','GLD','TLT','XLF','XLK','ARKK','DIA','IEFA'];
  // Also include symbols already on watchlist
  const wlSymbols = load().map(x => x.symbol);
  const all = [...new Set([...wlSymbols, ...common])];
  const matches = all.filter(s => s.startsWith(q.toUpperCase())).slice(0, 6);
  if (!matches.length) { closePlanAc(); return; }
  const list = document.getElementById('planAcList');
  list.innerHTML = matches.map(s => `<div class="ac-item" onclick="pickPlanAc('${s}')"><span class="ac-sym">${s}</span></div>`).join('');
  list.classList.add('open');
}
function pickPlanAc(sym) { document.getElementById('pSymbol').value = sym; closePlanAc(); }
function closePlanAc() {
  document.getElementById('planAcList').classList.remove('open');
  document.getElementById('planAcList').innerHTML = '';
}

render();
doRefresh();
</script>
